version: '3'

services:
  web_inpecciones:
    build:
      context: .
      dockerfile: config/Dockerfile
    image: web-inpecciones-v1.0
    restart: always
    container_name: web_inpecciones
    networks:
      - red-gane-int

  api-inpecciones:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: api-inpecciones
    restart: always
    image: api-inpecciones-v1.0
    networks:
      - red-gane-int
    environment:
      - TZ=America/Bogota
      
networks:
  red-gane-int:
    external: true
